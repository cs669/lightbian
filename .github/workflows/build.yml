name: Build ISOs

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y live-build curl gnupg ca-certificates
      - name: Build
        run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: lightbian-${{ matrix.arch }}
          path: out/*.iso
          compression-level: 0
