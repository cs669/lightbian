# Lightbian installer disk setup.
# Tick "Encrypt system" in the installer to get LUKS2 (argon2id) on the root
# partition. /boot stays unencrypted because GRUB can't open argon2id volumes.
# Swap is a file inside the encrypted root, so it's encrypted too.

efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"

userSwapChoices:
  - none
  - file
initialSwapChoice: file

initialPartitioningChoice: erase
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
  - name: "root"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
